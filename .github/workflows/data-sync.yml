name: 税率数据同步与时效审计

# Mondays at 06:00 UTC. Rate changes are annual events, but their triggers are scattered across
# the year: the US IRS inflation adjustments (autumn), Canadian provisions taking effect mid-year,
# and China's social insurance year rolling over in July.
# A weekly check catches a change within days without hammering upstream's public-good API.
# 每周一 06:00 UTC。税率变更是年度事件，但触发点分散在全年：
# 美国 IRS 的通胀调整（秋季）、加拿大年中生效的条款、中国 7 月的社保年度切换。
# 每周检查一次足以在变更后几天内发现，又不会打扰上游的公益 API。
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # ---- What can be automated: pull from upstream 能自动的部分：拉上游 ----
      - name: 同步美加可自动化的参数
        run: pnpm --filter @pmp/engine data:sync -- --write --year $(date -u +%Y)

      # ---- What can't: change detection, advisory only 不能自动的部分：变更检测，仅作参考 ----
      - name: 无上游数据源的变更检测
        continue-on-error: true
        run: pnpm --filter @pmp/engine data:check -- --snapshot

      # ---- Cross-check: catches "the algorithm is wrong", not just "the number was copied wrong"
      #      交叉验证：抓「算法用错了」而不只是「数字抄错了」----
      - name: 差分验证（本引擎 vs PolicyEngine 实时 API）
        continue-on-error: true
        run: pnpm --filter @pmp/engine data:verify

      - name: 同步后必须仍然全绿
        run: pnpm test

      - name: 有变更则开 PR
        id: create_pr
        continue-on-error: true
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/data-sync
          title: '数据同步：税率与缴费基数'
          commit-message: '数据同步：从 PolicyEngine 更新美加税率参数'
          body: |
            由 `.github/workflows/data-sync.yml` 自动生成。

            **合并前请人工确认：**
            - [ ] 数值变化与官方公告一致（不要盲信上游——上游自己也会过期，
                  且可能编码了它自己的实现技巧，参见俄亥俄的例子）
            - [ ] 差分验证的超差项都能解释（建模范围差异 vs 真的算错）
          labels: data
      - name: PR 创建受限时提示
        if: steps.create_pr.outcome == 'failure'
        run: |
          echo "::warning::Repository settings currently disallow GitHub Actions from creating pull requests. Enable “Allow GitHub Actions to create and approve pull requests” to restore automatic PR creation."

  # ---- The freshness audit: this is the gate that guarantees stale data is never used silently
  #      时效审计：这才是「保证不会静默用旧数据」的门禁 ----
  #
  # Everything syncable has been synced; the rest (all of China, Canada's CPP/EI and provincial
  # data, two US states) has no automatable source at all. "Always current" is out of reach, but
  # "expiry is always detected" is not.
  # 能同步的已经同步了；剩下的（中国全部、加拿大 CPP/EI 与省级、美国两个州）
  # 没有任何可自动化的源。做不到「一直最新」，但做得到「过期一定被发现」。
  audit:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: 数据时效审计
        id: audit
        run: |
          set -o pipefail
          pnpm --filter @pmp/engine data:audit -- --in 45 2>&1 | tee audit.txt

      - name: 过期则开 issue 盯人
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('audit.txt', 'utf8').replace(/\x1b\[[0-9;]*m/g, '');
            const title = '数据已过期，需要人工核对';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'data-stale',
            });
            const existing = open.find((i) => i.title === title);
            const text = ['以下数据集已过适用期，这些项没有可自动同步的上游，需要人工核对：',
                          '', '```', body.trim(), '```'].join('\n');
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body: text,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body: text, labels: ['data-stale'],
              });
            }
