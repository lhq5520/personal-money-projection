name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Prisma Client 是生成产物、不进仓库，不生成的话 apps/api 的类型检查必然失败。
      # generate 只读 schema 不连库，占位 URL 足够满足 datasource 的 env() 求值。
      - name: 生成 Prisma Client
        run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://placeholder
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @pmp/web build
      # PR 上只警告不阻断：数据过期是维护节奏问题，不该挡住无关的代码改动。
      # 真正的门禁在 data-sync.yml 的 audit job（每周跑，过期就开 issue）。
      - name: 数据时效（仅警告）
        run: pnpm --filter @pmp/engine data:audit -- --warn-only
