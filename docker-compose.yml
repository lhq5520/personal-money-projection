services:
  db:
    image: postgres:17-alpine
    container_name: pmp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pmp
      POSTGRES_PASSWORD: pmp
      POSTGRES_DB: pmp
    ports:
      - "5433:5432"
    volumes:
      - pmp-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pmp -d pmp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pmp-pgdata:
